[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cohesian-workspace"
version = "0.1.0"
description = "Tree-based management of the repositories in a Workspace index"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
workspace = "workspace_cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]
